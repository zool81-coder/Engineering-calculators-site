<!DOCTYPE html>
<html lang="ru">
<head>

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22bg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23243b55%22%2F%3E%3Cstop%20offset%3D%220.55%22%20stop-color%3D%22%2316213e%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230f172a%22%2F%3E%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22body%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23f5e6ce%22%2F%3E%3Cstop%20offset%3D%220.5%22%20stop-color%3D%22%23e6cfA6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23cfa877%22%2F%3E%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22lead%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23e0e0e0%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239e9e9e%22%2F%3E%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22cap%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23cfd8dc%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2390a4ae%22%2F%3E%3C%2FlinearGradient%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22gloss%22%20cx%3D%220.5%22%20cy%3D%220.18%22%20r%3D%220.7%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffffff%22%20stop-opacity%3D%220.30%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ffffff%22%20stop-opacity%3D%220%22%2F%3E%3C%2FradialGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22url%28%23bg%29%22%2F%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22url%28%23gloss%29%22%2F%3E%0A%20%20%3Cellipse%20cx%3D%22256%22%20cy%3D%22330%22%20rx%3D%22150%22%20ry%3D%2224%22%20fill%3D%22%23000000%22%20opacity%3D%220.22%22%2F%3E%0A%20%20%3Crect%20x%3D%2252%22%20y%3D%22240%22%20width%3D%2296%22%20height%3D%2228%22%20rx%3D%229%22%20fill%3D%22url%28%23lead%29%22%2F%3E%0A%20%20%3Crect%20x%3D%22364%22%20y%3D%22240%22%20width%3D%2296%22%20height%3D%2228%22%20rx%3D%229%22%20fill%3D%22url%28%23lead%29%22%2F%3E%0A%20%20%3Crect%20x%3D%22142%22%20y%3D%22186%22%20width%3D%22228%22%20height%3D%22136%22%20rx%3D%2226%22%20fill%3D%22url%28%23body%29%22%20stroke%3D%22%23b98d5a%22%20stroke-width%3D%225%22%2F%3E%0A%20%20%3Crect%20x%3D%22142%22%20y%3D%22186%22%20width%3D%2218%22%20height%3D%22136%22%20rx%3D%229%22%20fill%3D%22url%28%23cap%29%22%2F%3E%0A%20%20%3Crect%20x%3D%22352%22%20y%3D%22186%22%20width%3D%2218%22%20height%3D%22136%22%20rx%3D%229%22%20fill%3D%22url%28%23cap%29%22%2F%3E%0A%20%20%3Crect%20x%3D%22184%22%20y%3D%22186%22%20width%3D%2218%22%20height%3D%22136%22%20fill%3D%22%23795548%22%2F%3E%0A%20%20%3Crect%20x%3D%22206%22%20y%3D%22186%22%20width%3D%2218%22%20height%3D%22136%22%20fill%3D%22%231a1a1a%22%2F%3E%0A%20%20%3Crect%20x%3D%22228%22%20y%3D%22186%22%20width%3D%2218%22%20height%3D%22136%22%20fill%3D%22%23e53935%22%2F%3E%0A%20%20%3Crect%20x%3D%22322%22%20y%3D%22186%22%20width%3D%2218%22%20height%3D%22136%22%20fill%3D%22%23fbc02d%22%2F%3E%0A%20%20%3Crect%20x%3D%22156%22%20y%3D%22196%22%20width%3D%22200%22%20height%3D%2222%22%20rx%3D%2211%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%3Ctext%20x%3D%22256%22%20y%3D%22404%22%20text-anchor%3D%22middle%22%20fill%3D%22%23e8eaf6%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2246%22%20font-weight%3D%22bold%22%3E%CE%A9%3C%2Ftext%3E%0A%3C%2Fsvg%3E">
    <title>Калькулятор резисторов</title>
    <style>
        :root { --bg: #1a1a2e; --panel: rgba(255,255,255,0.07); --resistor-bg: #e8c39e; --resistor-border: #a9713c; --resistor-text: #3a2a1a; --green: #4CAF50; --red: #e74c3c; --accent: #FFD700; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: white; min-height: 100vh; min-height: 100dvh; overflow-x: auto; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 900px; margin: 0 auto; padding: 16px; min-width: 320px; }
        .back-link { display: inline-block; color: #ccc; font-size: 13px; text-decoration: none; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.1); margin-bottom: 12px; }
        .back-link:hover { background: rgba(255,255,255,0.2); color: white; }
        h1 { font-size: 22px; text-align: center; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        h1 .icon-res { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 8px; overflow: hidden; }
        h1 .icon-res svg { width: 44px; height: 44px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
        .total-box { background: var(--panel); border: 2px solid var(--accent); border-radius: 14px; padding: 14px 18px; text-align: center; margin-bottom: 10px; }
        .total-label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 2px; }
        .total-value { font-size: 34px; font-weight: bold; color: var(--accent); }
        .legend { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: #bbb; margin-bottom: 14px; }
        .legend span { background: rgba(255,255,255,0.06); padding: 5px 10px; border-radius: 20px; }
        #circuit { display: flex; align-items: center; gap: 4px; padding: 16px 8px; overflow-x: auto; background: rgba(0,0,0,0.2); border-radius: 14px; min-height: 120px; }
        .column { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; }
        .r-cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .r-row { display: flex; align-items: center; gap: 4px; }
        .lead { width: 14px; height: 3px; background: #9aa5b1; border-radius: 2px; }
        .r-name { font-size: 11px; font-weight: bold; color: #b0bec5; background: rgba(255,255,255,0.1); padding: 1px 6px; border-radius: 10px; letter-spacing: 0.5px; user-select: none; }
        .resistor { display: flex; align-items: center; gap: 4px; background: var(--resistor-bg); border: 2px solid var(--resistor-border); border-radius: 10px; padding: 6px 10px; min-width: 120px; box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15); }
        .r-symbol { font-size: 18px; color: #6b4d2a; font-weight: bold; }
        .r-input { width: 72px; border: none; background: transparent; text-align: center; font-size: 18px; font-weight: bold; color: var(--resistor-text); outline: none; }
        .r-unit { font-size: 13px; font-weight: bold; color: #6b4d2a; min-width: 28px; }
        .plus { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--green); color: white; font-size: 20px; font-weight: bold; cursor: pointer; line-height: 1; touch-action: manipulation; flex: 0 0 auto; }
        .plus:active { opacity: 0.7; }
        .remove { position: absolute; top: -10px; right: -10px; width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--red); color: white; font-size: 12px; cursor: pointer; line-height: 1; z-index: 5; }
        .remove:active { opacity: 0.7; }
        .col-connector { color: #9aa5b1; font-size: 20px; padding: 0 4px; flex: 0 0 auto; user-select: none; }
        .col-total { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: bold; color: #8fd3ff; min-width: 90px; text-align: center; white-space: nowrap; }
        .btn-reset { display: block; margin: 16px auto 0; padding: 10px 24px; border: none; border-radius: 10px; background: #555; color: white; font-size: 15px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        .btn-reset:active { opacity: 0.75; }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-link">← На главную</a>
        <h1><span class="icon-res"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243b55"/><stop offset="0.55" stop-color="#16213e"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5e6ce"/><stop offset="0.5" stop-color="#e6cfA6"/><stop offset="1" stop-color="#cfa877"/></linearGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0e0e0"/><stop offset="1" stop-color="#9e9e9e"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd8dc"/><stop offset="1" stop-color="#90a4ae"/></linearGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.18" r="0.7"><stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#gloss)"/>
  <ellipse cx="256" cy="330" rx="150" ry="24" fill="#000000" opacity="0.22"/>
  <rect x="52" y="240" width="96" height="28" rx="9" fill="url(#lead)"/>
  <rect x="364" y="240" width="96" height="28" rx="9" fill="url(#lead)"/>
  <rect x="142" y="186" width="228" height="136" rx="26" fill="url(#body)" stroke="#b98d5a" stroke-width="5"/>
  <rect x="142" y="186" width="18" height="136" rx="9" fill="url(#cap)"/>
  <rect x="352" y="186" width="18" height="136" rx="9" fill="url(#cap)"/>
  <rect x="184" y="186" width="18" height="136" fill="#795548"/>
  <rect x="206" y="186" width="18" height="136" fill="#1a1a1a"/>
  <rect x="228" y="186" width="18" height="136" fill="#e53935"/>
  <rect x="322" y="186" width="18" height="136" fill="#fbc02d"/>
  <rect x="156" y="196" width="200" height="22" rx="11" fill="#ffffff" opacity="0.25"/>
  <text x="256" y="404" text-anchor="middle" fill="#e8eaf6" font-family="Arial, sans-serif" font-size="46" font-weight="bold">Ω</text>
</svg></span>Калькулятор резисторов</h1>
        <p class="subtitle">Собирайте цепь: «＋» справа — последовательно, «＋» снизу — параллельно</p>

        <div class="total-box">
            <span class="total-label">Общее сопротивление цепи</span>
            <span class="total-value" id="totalValue">0 Ом</span>
        </div>

        <div class="legend">
            <span>＋ → последовательно</span>
            <span>＋ ↓ параллельно</span>
            <span>1000 → 1 кОм</span>
            <span>1 000 000 → 1 МОм</span>
        </div>

        <div id="circuit"></div>

        <button id="resetBtn" class="btn-reset">↺ Сбросить цепь</button>

        <p class="footer">Столбцы соединяются последовательно · в столбце резисторы — параллельно</p>
    </div>

    <script>
        var DEFAULT_R = 100;
        var nextResistorNumber = 2;
        var columns = [[ { value: DEFAULT_R, num: 1 } ]];
        var circuitEl = document.getElementById('circuit');
        var totalValueEl = document.getElementById('totalValue');

        function trimNum(x) { var s = String(x); if (s.indexOf('.') < 0) return s; s = s.replace(/0+$/,''); s = s.replace(/\.$/,''); return s === '' ? '0' : s; }
        function round3(x) { return Math.round(x * 1000) / 1000; }
        function unitLabel(u) { return u === 2 ? 'МОм' : (u === 1 ? 'кОм' : 'Ом'); }
        function fmtOhms(v) { if (v >= 1e6) return trimNum(round3(v/1e6)) + ' МОм'; if (v >= 1000) return trimNum(round3(v/1000)) + ' кОм'; if (v === 0) return '0 Ом'; return trimNum(round3(v)) + ' Ом'; }
        function toDisplay(v) { if (v === 0) return { mantissa: '', unit: 0 }; var unit = 0; if (v >= 1e6) unit = 2; else if (v >= 1000) unit = 1; return { mantissa: trimNum(v / Math.pow(1000, unit)), unit: unit }; }

        function columnResistance(col) { var arr = columns[col]; if (!arr || arr.length === 0) return 0; var sumInv = 0; for (var i = 0; i < arr.length; i++) { if (arr[i].value === 0) return 0; sumInv += 1 / arr[i].value; } return (sumInv === 0) ? 0 : (1 / sumInv); }
        function totalResistance() { var sum = 0; for (var c = 0; c < columns.length; c++) sum += columnResistance(c); return sum; }

        function renderCircuit() {
            var h = '';
            for (var c = 0; c < columns.length; c++) {
                h += '<div class="column">';
                for (var r = 0; r < columns[c].length; r++) {
                    var res = columns[c][r];
                    var d = toDisplay(res.value);
                    h += '<div class="r-cell">';
                    h += '<button class="remove" data-col="' + c + '" data-row="' + r + '" title="Удалить резистор">✕</button>';
                    h += '<span class="r-name">R' + res.num + '</span>';
                    h += '<div class="r-row">';
                    h += '<span class="lead"></span>';
                    h += '<div class="resistor"><span class="r-symbol">Ω</span><input class="r-input" data-col="' + c + '" data-row="' + r + '" data-unit="' + d.unit + '" value="' + d.mantissa + '" placeholder="0" inputmode="decimal"><span class="r-unit">' + unitLabel(d.unit) + '</span></div>';
                    h += '<span class="lead"></span>';
                    h += '<button class="plus plus-series" data-col="' + c + '" data-row="' + r + '" title="Добавить последовательно (справа)">＋</button>';
                    h += '</div>';
                    h += '<button class="plus plus-parallel" data-col="' + c + '" data-row="' + r + '" title="Добавить параллельно (снизу)">＋</button>';
                    h += '</div>';
                }
                h += '<div class="col-total" id="coltotal-' + c + '">' + fmtOhms(columnResistance(c)) + '</div>';
                h += '</div>';
                if (c < columns.length - 1) h += '<div class="col-connector">→</div>';
            }
            circuitEl.innerHTML = h;
            updateTotal();
        }
        function updateColumnTotals() { for (var c = 0; c < columns.length; c++) { var el = document.getElementById('coltotal-' + c); if (el) el.textContent = fmtOhms(columnResistance(c)); } }
        function updateTotal() { totalValueEl.textContent = fmtOhms(totalResistance()); }

        function addResistor(col, row) { var cv = columns[col][row].value; columns[col].push({ value: cv, num: nextResistorNumber++ }); renderCircuit(); }
        function addColumn(col, row) { var cv = columns[col][row].value; columns.splice(col + 1, 0, [{ value: cv, num: nextResistorNumber++ }]); renderCircuit(); }
        function removeResistor(col, row) { if (columns.length === 1 && columns[0].length === 1) { columns[0][0].value = DEFAULT_R; columns[0][0].num = 1; nextResistorNumber = 2; renderCircuit(); return; } columns[col].splice(row, 1); if (columns[col].length === 0) columns.splice(col, 1); renderCircuit(); }
        function resetCircuit() { columns = [[{ value: DEFAULT_R, num: 1 }]]; nextResistorNumber = 2; renderCircuit(); }

        function handleResistorInput(el) {
            var col = parseInt(el.dataset.col), row = parseInt(el.dataset.row);
            var unitSpan = el.parentNode.querySelector('.r-unit');
            var raw = el.value;
            var cleaned = raw.replace(/,/g, '.').replace(/[^0-9.]/g, '');
            var dotPos = cleaned.indexOf('.');
            if (dotPos >= 0) cleaned = cleaned.slice(0, dotPos + 1) + cleaned.slice(dotPos + 1).replace(/\./g, '');
            if (el.value !== cleaned) el.value = cleaned;
            if (cleaned === '' || cleaned === '.') { el.dataset.unit = '0'; if (unitSpan) unitSpan.textContent = 'Ом'; columns[col][row].value = 0; updateColumnTotals(); updateTotal(); return; }
            var n = parseFloat(cleaned); if (isNaN(n)) n = 0;
            var unit = parseInt(el.dataset.unit) || 0;
            if (n >= 1000 && unit < 2) { while (n >= 1000 && unit < 2) { n = n / 1000; unit++; } el.value = trimNum(n); el.dataset.unit = String(unit); if (unitSpan) unitSpan.textContent = unitLabel(unit); }
            columns[col][row].value = n * Math.pow(1000, unit);
            updateColumnTotals(); updateTotal();
        }

        circuitEl.addEventListener('click', function(e) {
            var t = e.target;
            if (t.classList.contains('plus-series')) addColumn(parseInt(t.dataset.col), parseInt(t.dataset.row));
            else if (t.classList.contains('plus-parallel')) addResistor(parseInt(t.dataset.col), parseInt(t.dataset.row));
            else if (t.classList.contains('remove')) removeResistor(parseInt(t.dataset.col), parseInt(t.dataset.row));
        });
        circuitEl.addEventListener('input', function(e) { if (e.target.classList.contains('r-input')) handleResistorInput(e.target); });
        document.getElementById('resetBtn').addEventListener('click', resetCircuit);
        renderCircuit();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
    </script>
</body>
</html>
